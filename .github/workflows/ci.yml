name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Type check with mypy
        run: make type-check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        # apt mirrors have stalled for 20+ minutes on some runners; bound each
        # attempt and retry instead of hanging the job.
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                   install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "FFmpeg install attempt $attempt failed; retrying" >&2
            sleep 10
          done
          exit 1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Test with coverage
        run: pytest --cov=bookbot --cov-report=term-missing --cov-report=xml
      - name: Smoke test CLI
        if: always()
        run: |
          bookbot --help
          bookbot doctor
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/bookbot-wheel"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "${RUNNER_TEMP}/bookbot-wheel/Scripts/python" -m pip install dist/*.whl
            cd "${RUNNER_TEMP}"
            "${RUNNER_TEMP}/bookbot-wheel/Scripts/bookbot" --help
            "${RUNNER_TEMP}/bookbot-wheel/Scripts/python" -c "from importlib.resources import files; assert files('bookbot').joinpath('data/author_aliases.json').is_file()"
          else
            "${RUNNER_TEMP}/bookbot-wheel/bin/python" -m pip install dist/*.whl
            cd "${RUNNER_TEMP}"
            "${RUNNER_TEMP}/bookbot-wheel/bin/bookbot" --help
            "${RUNNER_TEMP}/bookbot-wheel/bin/python" -c "from importlib.resources import files; assert files('bookbot').joinpath('data/author_aliases.json').is_file()"
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Security audit
        run: pip-audit

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t bookbot-ci .
      - name: Smoke test help
        run: docker run --rm bookbot-ci --help
      - name: Smoke test doctor
        run: docker run --rm bookbot-ci doctor
